name: Surround build
on:
  push:
    branches: [surround]
  pull_request:
    branches: [surround]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: surround-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg python3-venv
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;23.2.8568313'
      - name: Tests, debug/release APKs and lint
        run: bash scripts/surround/build.sh
      - name: Reports (APKs withheld while review blockers remain)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surround-reports-${{ github.sha }}
          path: |
            .build/reports/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          retention-days: 7
          include-hidden-files: true
